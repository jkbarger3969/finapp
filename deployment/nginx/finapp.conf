# HTTP - Redirect to HTTPS
server {
    listen 80;
    server_name finapp.lonestarcowboychurch.org;
    return 301 https://$server_name$request_uri;
}

# HTTPS - Main Application
server {
    listen 443 ssl http2;
    server_name finapp.lonestarcowboychurch.org;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/finapp.lonestarcowboychurch.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finapp.lonestarcowboychurch.org/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    # Serve the built client files (React app)
    location / {
        root /home/keith/finapp/client/dist;
        try_files $uri $uri/ /index.html;
        
        # Never cache the service worker or its registration/runtime scripts -
        # the generic *.js rule below would otherwise cache them for a year,
        # leaving clients stuck on an old app build indefinitely. Must come
        # before the generic rule since nginx uses first-match among regex
        # locations.
        location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js)$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Cache static assets (JS, CSS, images)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Don't cache HTML files
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # GraphQL API - Proxy to backend
    location /graphql {
        proxy_pass http://localhost:4000/graphql;
        proxy_http_version 1.1;
        
        # WebSocket support (for GraphQL subscriptions if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Proxy headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts - 300s (not the usual 60s) because Admin > Backup & Restore's
        # createBackup mutation runs synchronously through this same endpoint and
        # can legitimately take a while on a real-sized database (mongodump +
        # per-collection bsondump verification, not just a quick query).
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Backup archive downloads (Admin > Backup & Restore tab) - Proxy to backend.
    # Needs its own block since only /graphql is proxied by default; without
    # this, requests here would fall through to the SPA catch-all above.
    location /admin/backups/ {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Backup archives can be large - allow more time to stream than the
        # default GraphQL timeouts above.
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Security: Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
